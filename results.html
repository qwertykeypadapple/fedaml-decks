<title>Federated AML on UPI data</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3f2ee; --card:#fcfcfb; --line:#dcdad1; --text:#0b0b0b; --text2:#52514e; --muted:#898781;
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --red:#e34948; --amber:#eda100; --good:#006300;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#101010; --card:#1a1a19; --line:#34332f; --text:#f0efec; --text2:#c3c2b7; --muted:#898781;
    --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --red:#e66767; --amber:#c98500; --good:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101010; --card:#1a1a19; --line:#34332f; --text:#f0efec; --text2:#c3c2b7; --muted:#898781;
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --red:#e66767; --amber:#c98500; --good:#0ca30c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:var(--bg)}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateX(60px);transition:opacity .55s ease,transform .55s ease}
.slide.active{opacity:1;pointer-events:auto;transform:none}
.slide.past{transform:translateX(-60px)}
.slide svg{width:1280px;height:720px;display:block}
text{font-family:inherit;fill:var(--text)}
.t2{fill:var(--text2)} .tm{fill:var(--muted)}
/* reveal / draw / grow animations (all triggered by .slide.active) */
.r{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0ms)}
.active .r{opacity:1;transform:none}
.rs{opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;transition:opacity .5s ease,transform .5s cubic-bezier(.2,1.4,.4,1);transition-delay:var(--d,0ms)}
.active .rs{opacity:1;transform:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s ease;transition-delay:var(--d,0ms)}
.active .draw{stroke-dashoffset:0}
.growx{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.active .growx{transform:scaleX(1)} .active .growy{transform:scaleY(1)}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
.blink{animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.pill{cursor:pointer}
.pill rect{transition:fill .2s}
.pill:hover rect{fill:var(--line)}
/* chrome */
#progress{position:fixed;left:0;top:0;height:4px;width:0;background:var(--blue);transition:width .5s ease;z-index:5}
#dots{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:9px;z-index:5}
#dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer;transition:background .3s,transform .3s}
#dots button.on{background:var(--blue);transform:scale(1.4)}
#nav{position:fixed;bottom:6px;right:14px;display:flex;gap:8px;z-index:5}
#nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
#count{position:fixed;bottom:16px;left:16px;font-size:13px;color:var(--muted);z-index:5}
#tip{position:fixed;display:none;z-index:9;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.45;box-shadow:0 4px 18px rgba(0,0,0,.18);max-width:300px}
.notrans .slide,.notrans .r,.notrans .rs,.notrans .draw,.notrans .growx,.notrans .growy{transition:none!important}
@media (prefers-reduced-motion: reduce){
  .slide,.r,.rs,.draw,.growx,.growy{transition:none!important} .pulse,.blink{animation:none!important}
}
</style>

    const to = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0), pre = el.dataset.pre || "", suf = el.dataset.suf || "", t0 = performance.now(), dur = 1300;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + fmtN(to * e, dec) + suf; if (k < 1) requestAnimationFrame(step); };
    el.textContent = pre + fmtN(0, dec) + suf; requestAnimationFrame(step);
  });
}
function fit() { const k = Math.min(innerWidth / 1280, (innerHeight - 30) / 720); $("stage").style.transform = `translate(-50%,-50%) scale(${k})`; }
let cur = -1;
function go(i) {
  i = Math.max(0, Math.min(slides.length - 1, i)); if (i === cur) return;
  slides.forEach((s, k) => { s.sec.classList.toggle("active", k === i); s.sec.classList.toggle("past", k < i); });
  cur = i; $("progress").style.width = ((i + 1) / slides.length * 100) + "%";
  document.querySelectorAll("#dots button").forEach((b, k) => b.classList.toggle("on", k === i));
  $("count").textContent = `${i + 1} / ${slides.length}`; history.replaceState(null, "", "#" + (i + 1));
  const s = slides[i]; if (s.enter) s.enter(); countUp(s.sec);
  /* safety net: if the browser is not advancing transitions (throttled/background tab), jump straight to the final state */
  setTimeout(() => { if (cur === i && parseFloat(getComputedStyle(s.sec).opacity) < 0.05) document.body.classList.add("notrans"); }, 1800);
}
